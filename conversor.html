<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tueste Norte - Cafe de Especilidades de origen</title>
   
    
</head>
<body>
    <header class="cabecera">
        <h1>Tueste Norte</h1>
        <p> Café de Especialidad tostado en pequeños lotes</p><br>

    </header>


    <main>
        <section id="calculadora">
            <h2>Calculadora de Precios</h2>
            
            <form id="calcularcafe">

                <label for="cafe">Elige tu café:</label>
                <select id="cafe" name="cafe" requiered>
                    <option value=""disabled selected>-- Selecciona un café --</option>
                    <option value="12.50 €">Etiopía (12.50€)</option>
                    <option value="13.50 €">Colombia (13.50€)</option>
                    <option value="14.50 €">Brasil (14.50€)</option>
                    <option value="13.90 €">Guatemala (13.90€)</option>
                </select>
                
                <label form="cantidad">Cantidad:</label>
                <input type="number" id="cantidad" name="cantidad" min="1" max="10" required placeholder="1">
               <br><br> 
                
               <button type="button" id="botoncalcular">Calcular</button>
               <br><br>
               
               <label for="resultado">Total a Pagar (€):</label>
               <input type="text" id="resultado" name="resultado" value="0.00" readonly style="background-color: #f0f0f0; font-weight: bold;">

            </form>
            



        </section>
    </main>
    <script src="conversor.js"></script>
</body>
</html>
