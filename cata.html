<h2>Reserva de Catas</h2>


        <form action="nombre" method="POST">

            <div>
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ej.Juan Peréz">

            </div>
            <br>
            <div>
                <label form="plazas">Número de plazas:</label>
                <input type="number" id="plazas" name="plazas" min="1" max="4" required placeholder="1">

            </div>
            <br>
            <button type="submit">Reservar</button>
        </form>
